<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08111c">
  <title>Gomaa AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page-shell">
    <section class="hero-glow" aria-hidden="true"></section>

    <!-- زر فتح/إغلاق الشات -->
    <button
      class="chat-launcher"
      id="chatLauncher"
      type="button"
      aria-label="فتح المساعد"
      aria-expanded="false"
      aria-controls="chatCard"
    >
      <img src="images/logo.png" alt="" width="72" height="72">
      <span class="launcher-dot" aria-hidden="true"></span>
    </button>

    <!-- نافذة الشات -->
    <section class="chat-card is-hidden" id="chatCard" aria-label="محادثة Gomaa AI" aria-hidden="true">
      <header class="chat-header">
        <div class="brand-wrap">
          <div class="brand-logo">
            <img src="images/logo.png" alt="شعار المنصة">
          </div>
          <div class="brand-text">
            <h1>Gomaa AI</h1>
            <span><i></i> جاهز لمساعدتك في التاريخ والجغرافيا السياسية</span>
          </div>
        </div>

        <div class="header-actions">
          <button class="icon-btn" id="newChatBtn" type="button" aria-label="بدء محادثة جديدة" title="محادثة جديدة">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 11a8 8 0 0 0-14.9-4M4 5V9h4M4 13a8 8 0 0 0 14.9 4M20 19v-4h-4"/>
            </svg>
          </button>
          <button class="icon-btn close-btn" id="closeChatBtn" type="button" aria-label="إغلاق المحادثة" title="إغلاق">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 6l12 12M18 6L6 18"/>
            </svg>
          </button>
        </div>
      </header>

      <div class="chat-body" id="chatBody">
        <div class="welcome" id="welcomeScreen">
          <div class="welcome-logo-wrap">
            <div class="logo-halo"></div>
            <img src="images/logo.png" alt="شعار المنصة" class="welcome-logo">
          </div>

          <h2>تعالى أجاوبك عاللي فبالك!</h2>
        </div>

        <div class="messages" id="messages" aria-live="polite"></div>
      </div>

      <form class="composer" id="composer">
        <div class="input-wrap">
          <textarea
            id="messageInput"
            rows="1"
            maxlength="4000"
            autocomplete="off"
            placeholder="اكتب سؤالك هنا..."
            aria-label="اكتب سؤالك"
          ></textarea>
        </div>

        <button class="send-btn" id="sendBtn" type="submit" aria-label="إرسال">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 4l16 8-16 8 3-8-3-8zM7 12h10"/>
          </svg>
        </button>
      </form>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
